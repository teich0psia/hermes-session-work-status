<!doctype html>
<html lang="ja"><meta charset="UTF-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Session Work Status — SDK harness (not Desktop)</title>
<style>
:root { --ui-text-primary: #e6e8ef; --ui-text-secondary: #a8b1c4; --ui-stroke-secondary: #39435a; --ui-bg-secondary: #202838; --ui-accent: #bba5ff; color-scheme: dark; }
body { margin: 0; background: #171d29; color: var(--ui-text-primary); font: 13px sans-serif; }
main { display: flex; gap: 12px; height: 600px; padding: 16px; }
aside { width: 260px; flex-shrink: 0; }
h2 { font-size: 13px; }
[data-row] { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--ui-stroke-secondary); }
#pane { width: 300px; border: 1px solid var(--ui-stroke-secondary); }
button { cursor: pointer; color: var(--ui-text-primary); background: var(--ui-bg-secondary); border: 1px solid var(--ui-stroke-secondary); border-radius: 3px; padding: 4px 6px; font: inherit; }
button:disabled { opacity: .55; } button[aria-pressed=true] { border-color: var(--ui-accent); }
[role=menu] { background: var(--ui-bg-secondary); color: var(--ui-text-primary); padding: 4px; border: 1px solid var(--ui-stroke-secondary); z-index: 100; }
[role=menuitem] { padding: 5px 8px; cursor: pointer; } [data-highlighted] { outline: 1px solid var(--ui-accent); }
button:focus-visible, select:focus-visible { outline: 2px solid var(--ui-accent); }
@media(max-width:600px) { main { display:block; height:auto; padding:8px; } aside { width:100%; } #pane { width:100%; height:580px; margin-top:12px; } }
</style><div id="root"></div><script type="module" src="./bundle.js"></script></html>
